name: build-installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:            # кнопка "Run workflow": собрать без публикации

permissions:
  contents: write               # создать релиз и залить в него файл

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.2       # пин: воспроизводимая сборка

      - name: Определить версию
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' -replace '^v', '' } else { '0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Записать версию в единственный источник
        run: python tools/set_version.py ${{ steps.ver.outputs.version }}

      - name: Собрать .exe
        run: python -m PyInstaller --noconfirm --clean --log-level WARN Facet.spec

      - name: Смоук — selftest собранного exe (основной путь + multiprocessing)
        shell: pwsh
        run: |
          # Headless-проверка: без неё можно выпустить релиз, который не стартует —
          # PyInstaller не падает на отсутствующей зависимости, он её просто не кладёт.
          $log = "selftest.log"
          $p = Start-Process -FilePath "dist\Facet\Facet.exe" -ArgumentList "--selftest","$log" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "selftest вышел с кодом $($p.ExitCode)" }
          if (-not (Test-Path $log)) { throw "нет $log" }
          $t = (Get-Content $log -Raw).Trim()
          Write-Output $t
          if ($t -notmatch 'SELFTEST_OK') { throw "selftest не OK: $t" }

      - name: Смоук — окно стартует
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Facet\Facet.exe" -PassThru
          Start-Sleep -Seconds 20
          $p.Refresh()
          if ($p.HasExited) { throw "программа завершилась сама, код $($p.ExitCode)" }
          $title = $p.MainWindowTitle
          Stop-Process -Id $p.Id -Force
          Write-Output "title='$title'"
          # На headless-раннере заголовок может не считаться — тогда не валим сборку;
          # но НЕПУСТОЙ и не 'Facet*' — это ошибка (напр. окно трейсбека PyInstaller).
          if ($title -and ($title -notlike 'Facet*')) { throw "неожиданный заголовок окна: '$title'" }

      - name: Собрать установщик
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe не найден" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" Facet.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Проверить установщик
        shell: pwsh
        run: |
          $f = "installer\Facet-setup.exe"
          if (-not (Test-Path $f)) { throw "нет файла $f" }
          $mb = [math]::Round((Get-Item $f).Length / 1MB, 1)
          Write-Output "installer: $mb MB"
          if ($mb -lt 3) { throw "установщик подозрительно мал: $mb MB" }

      - uses: actions/upload-artifact@v4
        with:
          name: Facet-setup
          path: installer/Facet-setup.exe

      - name: Опубликовать релиз
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Facet ${{ steps.ver.outputs.version }}
          files: installer/Facet-setup.exe
          body: |
            **Windows 10/11, 64-bit.** Скачайте `Facet-setup.exe` ниже и запустите —
            Python и все библиотеки внутри, ставить отдельно ничего не нужно.

            При первом запуске Windows покажет синий экран «Windows защитила ваш
            компьютер». Это ожидаемо для любого установщика без платной цифровой
            подписи: нажмите **Подробнее** → **Выполнить в любом случае**.

            Программа устанавливается в профиль пользователя, права администратора
            не требуются.
